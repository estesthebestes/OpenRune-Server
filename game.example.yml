# Game values
# You want to edit these to fit your game.
name: "OpenRune"
game-port: 43594
revision: 241
environment: "LIVE"
world: 255

gameplay:
  drop-rates:
    # Server-wide multiplier for drops flagged `boosted` (2.0 turns 1/512 into 1/256). Stacks with
    # each player's own multiplier (varp.drop_rate_multiplier, percent; 0 = unset).
    multiplier: 1.0
  quest-requirements:
    # Temporary core-mechanics default. Use "respect-progress" when quest gates should use real
    # quest state, or "virtual-completions" for league-style profiles.
    mode: "assume-completed"
    virtual-completions: []
    virtual-lines: []
  # Grand Exchange: players trade against each other first, then a simulated market priced from the
  # OSRS Wiki real-time prices. Read at startup; see docs/grand-exchange.md.
  grand-exchange:
    enabled: true
    fill-model: instant              # instant (offers at or through the market price fill at once)
    prices:
      live: true                     # false = never touch the network, use the stored snapshot only
      refresh-minutes: 5             # background refresh; the wiki asks not to be hammered
      snapshot-path: ".data/ge/prices.json"
      user-agent: "OpenRune-Server GE price feed (private server) - github.com/OpenRune"
    tax:
      rate: 0.02                     # convenience fee on sells, per item, rounded down
      cap: 5000000                   # maximum fee per item

central:
  same-instance: true
  host: "127.0.0.1"
  link-port: 9091
  postgres:
    pool-size: 10


